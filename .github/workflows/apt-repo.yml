name: apt-repo

# Mantiene repo/ (el repositorio apt servido via raw.githubusercontent.com)
# sincronizado con los releases oficiales de PINCE, lo valida con un apt
# aislado y publica los cambios.
on:
  schedule:
    - cron: '17 */6 * * *'   # busca releases nuevos cada 6 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package-template/**'
      - 'tools/**'
      - 'build.sh'
      - 'validation/**'
      - '.github/workflows/apt-repo.yml'

permissions:
  contents: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar repo apt con los releases de PINCE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/update-repo.sh

      - name: Validar el repo con un apt aislado
        run: validation/validate.sh

      - name: Publicar cambios
        run: |
          if [ -n "$(git status --porcelain repo/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repo/
            git commit -m "chore(repo): sync with PINCE releases"
            git push
          else
            echo "Sin cambios que publicar."
          fi
